# =============================================================================
# DigiSociety College Edition — application.properties
# All secrets come from environment variables — never hardcoded here.
#
# IMPORTANT: Property KEY names must differ from the env var placeholder names.
# Spring Boot 3.4.x throws "Circular placeholder reference" if key == placeholder.
# Pattern used: app.* prefix for custom properties.
# =============================================================================

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL DataSource ─────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/digisociety_college}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT (app.* prefix avoids circular reference with env var names) ───────────
app.jwt.secret=${JWT_SECRET:CollegeDigiSocietySecret2026}
app.jwt.expires-ms=${JWT_EXPIRES_MS:28800000}

# ── Admin seed ────────────────────────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@college.digisociety.in}
app.admin.password=${ADMIN_PASSWORD:changeme123}

# ── Amazon S3 (non-secret config only — credentials come from env vars) ───────
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are read by the AWS SDK
# directly from the OS environment — never put them in this file.
app.s3.region=${AWS_REGION:ap-south-1}
app.s3.bucket=${AWS_S3_BUCKET:digisociety-college-docs}
app.s3.max-file-size-mb=${S3_MAX_FILE_SIZE_MB:10}
app.s3.presigned-url-expiry-minutes=${S3_PRESIGNED_EXPIRY_MINUTES:15}

# ── Spring multipart limits ───────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Spring Security (disable auto-generated login page) ───────────────────────
spring.security.user.name=disabled
spring.security.user.password=disabled

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.digisociety=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
