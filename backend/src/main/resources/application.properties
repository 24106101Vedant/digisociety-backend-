# ─────────────────────────────────────────────────────────────────────────────
# Lab Outcome : Implement backend services in Kotlin with database integration
#               and secure authentication.
#
# Aim 1       : Write Kotlin programs to demonstrate data types, collections,
#               and OOP concepts (classes, inheritance).
#
# Aim 2       : Write Kotlin program to implement exception handling and use
#               collection operations (map, filter, reduce).
# ─────────────────────────────────────────────────────────────────────────────
#
# application.properties  —  DigiSociety Spring Boot configuration
# Mirrors the .env file used by the Node.js backend.

# Server port (mirrors PORT in .env)
server.port=${PORT:4000}

# SQLite database file path (mirrors DB_PATH in .env)
DB_PATH=./data/digisociety.db

# JWT secret and expiry (mirrors JWT_SECRET / JWT_EXPIRES_IN in .env)
JWT_SECRET=${JWT_SECRET:DigisocietySecret123}
JWT_EXPIRES_MS=${JWT_EXPIRES_MS:28800000}

# Admin seed credentials (mirrors hard-coded values in server.js)
ADMIN_EMAIL=${ADMIN_EMAIL:digisociety.in@gmail.com}
ADMIN_PASSWORD=${ADMIN_PASSWORD:digisociety}

# Disable Spring Security's auto-generated login page
spring.security.user.name=disabled
spring.security.user.password=disabled

# Logging
logging.level.com.digisociety=INFO
logging.level.org.springframework.security=WARN
